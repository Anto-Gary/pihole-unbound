server:
    interface: 0.0.0.0
    port: 5335
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.20.0.6/32 allow
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    username: ""
    chroot: ""
    directory: "/usr/local/unbound"
    do-daemonize: no
    pidfile: "/tmp/unbound.pid"
    logfile: ""
    use-syslog: no
    verbosity: 1
    log-queries: no
    log-replies: no
    hide-identity: yes
    hide-version: yes

    module-config: "validator iterator"
    auto-trust-anchor-file: "/usr/local/unbound/iana.d/root.key"
    val-permissive-mode: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    aggressive-nsec: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    prefetch: yes
    num-threads: 1
    serve-expired: no

    # Authenticates the DoT providers below (Alpine's CA bundle inside the image).
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: ::ffff:0:0/96

    local-zone: "health.invalid." static
    local-data: "health.invalid. 60 IN A 192.0.2.1"

# All queries go to these providers over DNS-over-TLS and are validated locally.
# Both are unfiltered (Pi-hole does the blocking), so answers stay consistent.
# Unbound spreads queries across servers that respond quickly and skips dead ones.
# forward-first: no means it never falls back to plaintext or its own recursion.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-first: no
    forward-addr: 9.9.9.10@853#dns10.quad9.net
    forward-addr: 149.112.112.10@853#dns10.quad9.net
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 194.242.2.2@853#dns.mullvad.net
    forward-addr: 185.95.218.42@853#dns.digitale-gesellschaft.ch
