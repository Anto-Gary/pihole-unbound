name: pihole-unbound

services:
  pihole:
    container_name: pihole
    hostname: pihole
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    depends_on:
      unbound:
        condition: service_healthy
    networks:
      dns_net:
        ipv4_address: 172.20.0.6
    ports:
      - "192.168.1.144:53:53/tcp"
      - "192.168.1.144:53:53/udp"
      - "192.168.1.144:443:443/tcp"
    environment:
      TZ: ${TZ:-America/New_York}
      WEBPASSWORD_FILE: /run/secrets/pihole_password
      FTLCONF_dns_upstreams: "172.20.0.7#5335"
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_dnssec: "false"
      FTLCONF_dhcp_active: "false"
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      FTLCONF_ntp_sync_active: "false"
      FTLCONF_webserver_port: "443s"
    secrets:
      - pihole_password
    volumes:
      - ./etc-pihole:/etc/pihole
    cap_drop:
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 @127.0.0.1 pi.hole A | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  unbound:
    container_name: unbound
    image: madnuttah/unbound:1.26.1-1@sha256:d86e1adab0f6bf546d94898b5ca7effc34a09d554f21be5ddfc08112257f2254
    user: "1000:1000"
    environment:
      DISABLE_SET_PERMS: "true"
    networks:
      dns_net:
        ipv4_address: 172.20.0.7
    volumes:
      - ./etc-unbound/pihole.conf:/usr/local/unbound/unbound.conf:ro
      - unbound-state:/usr/local/unbound/iana.d
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Answers from a local static record, so internet outages don't mark it unhealthy.
      test: ["CMD-SHELL", "drill -Q -p 5335 health.invalid. @127.0.0.1 | grep -qx 192.0.2.1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dns_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  unbound-state:

secrets:
  pihole_password:
    file: ./.secrets/pihole_password
